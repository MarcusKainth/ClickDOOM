# cargo-nextest settings. `make test-group` and ci.yml run the suites through
# nextest so that each test is its own process and a group's binaries can
# run side by side. Every live test names its own database, so two running
# at once share nothing but the server.
[profile.default]
fail-fast = false
# A live suite's first session analyses a statement that takes a few minutes
# on a CI runner, so a test is slow only past this, and one that opens more
# than one session runs well past it before it is cut off. The cutoff is
# 2,400 s, about 1.8x the slowest test on record: sim_missile_live's own
# single test, 1,234 s at the median of five main runs and 1,347 s at its
# worst. A test's own time moves up to 35% run to run, so the margin is
# sized against the worst rather than the median. A test past the cutoff is
# killed, and the failure reads as a timeout rather than as anything about
# the test, which is why this is not tight.
slow-timeout = { period = "300s", terminate-after = 8 }
