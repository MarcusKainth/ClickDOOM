# cargo-nextest settings. `make test-group` and ci.yml run the suites through
# nextest so that each test is its own process and a group's binaries can
# run side by side. Every live test names its own database, so two running
# at once share nothing but the server.
[profile.default]
fail-fast = false
# A test is reported slow every 120 s and killed at 720 s. The slowest test
# in the six main runs 36126756550 to 36132815983 is sim_plat_live's
# a_crossing_spawns_the_plat_ev_do_plat_spawns_for_it, 215 s at the median
# and 227 s at its worst, so the cutoff is about 3x the worst. It sits above
# FIRST_TIC_TIMEOUT (600 s, native/src/resident/stream.rs) plus a load, so
# a first tic that never arrives fails with the session's own message
# rather than with nextest's. A test killed here reads as a timeout and
# says nothing about what the test checks.
slow-timeout = { period = "120s", terminate-after = 6 }
