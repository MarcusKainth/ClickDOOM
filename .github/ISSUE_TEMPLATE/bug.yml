name: Bug report
description: Something is wrong and it is not a refemu/sqlcpu divergence (use the divergence form for those).
labels: ["bug"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [rom, refemu, sqlcpu, executor, driver, render, ci, docs]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands from a clean checkout, `just` recipes preferred
      render: shell
    validations:
      required: true
