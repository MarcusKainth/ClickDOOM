# ClickDOOM CI.
#
# ClickHouse is pinned to 26.7.5.10 by image digest, once per service block
# below. GitHub does not expose the `env` context to `services.image`, so the
# literal is repeated rather than shared. All of them, and docker-compose.yml,
# must carry the same digest. Bumping the pin needs a `ci:` pull request with
# nightly deep-diff evidence.
#
# Every third-party action is pinned to a full commit SHA. `zizmor` fails the
# lint job if a pin or a token scope regresses.

name: ci

on:
  pull_request:
    # `edited` is here for pr-title, which reads the title rather than the diff.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

# Superseded pull request runs are cancelled. Pushes to main are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CLICKHOUSE_USER: default
  # Local-only. This database holds an emulator's RAM and nothing secret.
  # docker-compose.yml carries the same value.
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_DATABASE: clickdoom

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint PR title against commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/lint_pr_title.sh "$TITLE"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Purity check
        run: ./scripts/check_purity.sh
      - name: shellcheck
        # `-exec … +` rather than a pipe into xargs: a pipeline reports only the
        # last command's exit status, so a failing find would pass silently.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find scripts driver sqlcpu executor rom refemu -name '*.sh' -exec shellcheck {} +
      - name: ruff
        # The version the root lockfile pins, so CI and a local run agree.
        run: |
          pipx install uv
          uv run ruff check .
      - name: cargo fmt
        # rust-toolchain.toml pins the version, so the first cargo call
        # installs it and a local `make lint` speaks the same rustfmt.
        run: cargo fmt --all --check
      - name: cargo clippy
        # --all-targets so tests/ is linted too. Without it a test file behind
        # an unenabled feature never compiles and nothing says so.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: clang-format
        # rom/vendor/.clang-format sets DisableFormat, so the 192 vendored files
        # are skipped and only rom/src/ is checked.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang-format
          find rom \( -name '*.c' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +
      - name: typos
        run: |
          pipx install typos==1.50.0
          typos --config _typos.toml
      - name: zizmor
        run: |
          pipx install zizmor==1.28.0
          zizmor --persona=regular .github/

  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ROM (dockerized rv32 toolchain)
        run: make -C rom
      - name: Verify reproducible-build hash pin
        # Recomputed here rather than calling `make -C rom check-pinned-hash`,
        # so the pin is checked by something other than the tool that built it.
        run: |
          built=$(sha256sum rom/build/doom-rv32im.bin | cut -d' ' -f1)
          pinned=$(cat rom/PINNED_HASH)
          if [ "$built" != "$pinned" ]; then
            echo "::error::ROM hash mismatch: built=$built pinned=$pinned."
            echo "::error::Either the build went nondeterministic (P0) or the ROM changed without rom/PINNED_HASH being updated in the same PR."
            exit 1
          fi
      - name: Upload ROM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rom
          path: |
            rom/build/doom-rv32im.bin
            rom/build/manifest.json

  test-refemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Rust suites
        # No ROM and no ClickHouse. The comparisons that need the built ROM
        # are behind the rom-tests feature and run in their own job.
        run: cargo test --locked --workspace

  build-refemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the reference emulator
        run: cargo build --locked --release -p refemu
      - name: Upload refemu artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refemu
          path: target/release/refemu

  refemu-reference-parity:
    # The committed traces regenerated and compared byte for byte, and the
    # whole demo3 run against the values its manifest records. Kept out of
    # test-refemu so the ROM dependency stays off differential-smoke's
    # critical path, and runs alongside test-render instead.
    #
    # demo3 is 2,300,210,133 instructions and takes about ten seconds. The
    # timeout is sized for a runner having a bad day, not for that figure.
    needs: [build-rom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ROM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rom
          path: rom/build
      - name: Reference traces and the whole demo
        run: |
          cargo test --locked --release --workspace --features refemu/rom-tests \
              --test reference_trace --test demo3_parity -- --nocapture

  test-sqlcpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: riscv-tests inside ClickHouse
        run: ./sqlcpu/run_tests.sh --host localhost --port 9000

  test-executor:
    # The only job covering the fold tests and the schema fixtures they share
    # with the benches. Without it a break in either is invisible on a green
    # pull request page.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install clickhouse-client
        # The runner ships neither `clickhouse-client` nor `clickhouse`. The
        # tests invoke `clickhouse-client` by name, and the fetched binary
        # exposes the same thing as a `client` subcommand, so a wrapper stands
        # in for it rather than a rename.
        run: |
          curl -fsSL https://clickhouse.com/ -o /tmp/install.sh
          sh /tmp/install.sh
          sudo install -m 0755 clickhouse /usr/local/bin/clickhouse
          printf '#!/bin/sh\nexec /usr/local/bin/clickhouse client "$@"\n' | sudo tee /usr/local/bin/clickhouse-client >/dev/null
          sudo chmod +x /usr/local/bin/clickhouse-client
      - name: Fold unit tests
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "9000"
        run: |
          pipx install uv
          cd executor && uv sync --frozen && uv run pytest tests/ -v

  test-render:
    # Runs against a throwaway database, never `clickdoom`. Builds its own
    # refemu fixture by stepping the ROM to icount 15,393,136, at about
    # 1,064,000 instructions/sec, so it needs the built ROM and takes about 20
    # seconds once it has it.
    needs: [build-rom, build-refemu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ROM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rom
          path: rom/build
      - name: Download refemu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refemu
          path: target/release
      - name: Frame readout and render tests
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_HTTP_PORT: "8123"
        run: |
          chmod +x target/release/refemu
          cargo test --locked -p clickdoom-driver --test render_live -- --include-ignored --nocapture

  differential-smoke:
    # N instructions of the DOOM ROM on refemu against sqlcpu, comparing the
    # full checkpoint trace at every CHECKPOINT_INTERVAL rather than a sample.
    #
    # A GREEN RUN HERE MEANS "registers and control flow agreed over 24
    # comparisons". IT DOES NOT MEAN "the engines agree". 100,000 instructions
    # at CHECKPOINT_INTERVAL=4,096 spacing reaches no RAM_HASH_INTERVAL
    # (1,048,576) boundary, so `ramhash` and `fbhash` are never compared. That
    # leaves uncaught a corrupt RAM word which keeps every register
    # bit-identical. Only nightly's deep-diff exercises memory.
    #
    # N=100,000 because clickdoom diff clamps every sqlcpu batch to
    # <= CHECKPOINT_INTERVAL so it cannot skip a checkpoint row. Measured at
    # 990 instructions/sec, 101 seconds. Reaching the first memory comparison
    # would take about 13.9 minutes on every pull request. timeout-minutes is a
    # safety net for runner variance, not a substitute for that measurement.
    needs: [build-rom, build-refemu, test-refemu, test-sqlcpu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download ROM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rom
          path: rom/build
      - name: Download refemu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refemu
          path: target/release
      - name: Build clickdoom
        run: cargo build --locked --release -p clickdoom-driver
      - name: Smoke diff (100,000 instructions, full checkpoint trace)
        run: |
          chmod +x target/release/refemu
          ./target/release/clickdoom diff 100000 --host localhost --port 8123 \
              --bin rom/build/doom-rv32im.bin --manifest rom/build/manifest.json \
              --refemu-bin target/release/refemu
