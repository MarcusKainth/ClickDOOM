# ClickDOOM CI.
#
# ClickHouse comes from docker-compose.yml through `make up`, so the image
# digest and the server configuration are pinned in that one file. Bumping the
# pin needs a `ci:` pull request with nightly deep-diff evidence.
#
# Every third-party action is pinned to a full commit SHA. `zizmor` fails the
# lint job if a pin or a token scope regresses.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Superseded pull request runs are cancelled. Pushes to main are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CLICKHOUSE_USER: default
  # Local-only. This database holds an emulator's RAM and nothing secret.
  # docker-compose.yml carries the same value.
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_DATABASE: clickdoom

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Non-Rust lint tools
        # shellcheck, clang-format and actionlint have no cargo distribution.
        # `make lint` installs typos and zizmor through cargo itself.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck clang-format
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
              | bash -s -- 1.7.12
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Every static check
        # The same target a contributor runs, so CI and local cannot drift.
        run: make lint

  build-rom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ROM (dockerized rv32 toolchain)
        run: make -C rom
      - name: Verify the ELF is byte-reproducible
        # Through rom/Makefile, so the second build runs in the same pinned
        # toolchain image under the same flags as the first. It rebuilds the
        # ROM and then links once more, so the step costs two ROM builds.
        run: make -C rom check-elf-reproducible
      - name: Verify reproducible-build hash pin
        # Recomputed here rather than calling `make -C rom check-pinned-hash`,
        # so the pin is checked by something other than the tool that built it.
        run: |
          built=$(sha256sum rom/build/doom-rv32im.bin | cut -d' ' -f1)
          pinned=$(cat rom/PINNED_HASH)
          if [ "$built" != "$pinned" ]; then
            echo "::error::ROM hash mismatch: built=$built pinned=$pinned."
            echo "::error::Either the build went nondeterministic (P0) or the ROM changed without rom/PINNED_HASH being updated in the same PR."
            exit 1
          fi
      - name: Upload ROM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rom
          path: |
            rom/build/doom-rv32im.bin
            rom/build/doom-rv32im.elf
            rom/build/manifest.json

  build-refemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the reference emulator
        run: cargo build --locked --release -p refemu
      - name: Upload refemu artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refemu
          path: target/release/refemu

  build-tests:
    # Every test binary, compiled once into two nextest archives: the
    # workspace with the live suites, and the reference emulator's release
    # ROM suites. The test jobs run from the archives and compile nothing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest@0.9.140
      - name: Archive the suites
        run: |
          mkdir -p target/nextest
          cargo nextest archive --locked --workspace --features clickhouse-tests \
              --archive-file target/nextest/tests.tar.zst
          cargo nextest archive --locked --release -p refemu --features rom-tests \
              --archive-file target/nextest/rom-suites.tar.zst
      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archives
          path: target/nextest/*.tar.zst

  test:
    # Every suite, in the groups scripts/test-group.sh names, one runner per
    # group with its own ClickHouse, run from the archives build-tests made.
    # Throwaway databases only; never `clickdoom`. `make test` runs the same
    # suites in one pass locally.
    needs: [build-tests, build-rom, build-refemu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [emulator, native-sim-a, native-sim-b, native-sim-c, native-rest, driver-native]
    name: test (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-nextest@0.9.140
      - name: Start the pinned ClickHouse
        run: make up
      - name: Download the test archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-archives
          path: target/nextest
      - name: Download ROM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rom
          path: rom/build
      - name: Download refemu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refemu
          path: target/release
      - name: The group's suites
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_HTTP_PORT: "8123"
          CLICKHOUSE_PASSWORD: clickdoom
          GROUP: ${{ matrix.group }}
          NEXTEST_ARCHIVE_DIR: target/nextest
        run: |
          chmod +x target/release/refemu
          scripts/test-group.sh "$GROUP"

  differential-smoke:
    # N instructions of the DOOM ROM on refemu against sqlcpu, comparing the
    # full checkpoint trace at every CHECKPOINT_INTERVAL rather than a sample.
    #
    # A GREEN RUN HERE MEANS "registers and control flow agreed over 24
    # comparisons". IT DOES NOT MEAN "the engines agree". 100,000 instructions
    # at CHECKPOINT_INTERVAL=4,096 spacing reaches no RAM_HASH_INTERVAL
    # (1,048,576) boundary, so `ramhash` and `fbhash` are never compared. That
    # leaves uncaught a corrupt RAM word which keeps every register
    # bit-identical. Only nightly's deep-diff exercises memory.
    #
    # N=100,000 because clickdoom emulation diff clamps every sqlcpu batch to
    # <= CHECKPOINT_INTERVAL so it cannot skip a checkpoint row. Measured at
    # 990 instructions/sec, 101 seconds. Reaching the first memory comparison
    # would take about 13.9 minutes on every pull request. timeout-minutes is a
    # safety net for runner variance, not a substitute for that measurement.
    needs: [build-rom, build-refemu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cache restores target/ whole, so it goes before anything is
      # downloaded into it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start the pinned ClickHouse
        run: make up
      - name: Download ROM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rom
          path: rom/build
      - name: Download refemu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: refemu
          path: target/release
      - name: Build clickdoom
        run: cargo build --locked --release -p clickdoom-driver
      - name: Smoke diff (100,000 instructions, full checkpoint trace)
        run: |
          chmod +x target/release/refemu
          ./target/release/clickdoom emulation diff 100000 --host localhost --port 8123 \
              --bin rom/build/doom-rv32im.bin --manifest rom/build/manifest.json \
              --refemu-bin target/release/refemu
