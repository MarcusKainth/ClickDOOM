# ClickDOOM CI
#
# Design: every workstream-specific step is guarded with hashFiles() on a
# marker file, so this pipeline is GREEN on the empty skeleton and activates
# job-by-job as agents land code. Do not delete guards to "enable" a job —
# land the marker file (Makefile / test entrypoint) instead.
#
# PINNED VERSIONS (keep in sync with docker-compose.yml; bumps are `ci:` PRs
# with nightly deep-diff evidence — see SPEC §8):
#   ClickHouse: 26.3  (placeholder pin — Phase 0 ratifies the final version)

name: ci

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

env:
  CLICKHOUSE_VERSION: "26.3"
  # Credentials for the service containers below. Local-dev only: this database
  # holds an emulator's RAM, never a secret. docker-compose.yml must match.
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_DATABASE: clickdoom

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PR title against commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/lint_pr_title.sh "$TITLE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purity check (always on)
        run: ./scripts/check_purity.sh
      - name: shellcheck
        # scripts/driver only, until now -- predated sqlcpu/executor landing
        # shell scripts (justfile's own `lint` recipe comment flagged this
        # exact gap as a `ci:` follow-up). Matches `just lint`'s scope,
        # found auditing for CI/justfile orphans alongside #116.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find scripts driver sqlcpu executor rom -name '*.sh' -print0 2>/dev/null | xargs -0 -r shellcheck
      - name: "ruff (Python: refemu, driver)"
        if: hashFiles('refemu/pyproject.toml', 'driver/pyproject.toml') != ''
        run: |
          pipx install ruff
          ruff check refemu driver
      - name: clang-format (rom C sources)
        if: hashFiles('rom/**/*.c', 'rom/**/*.h') != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang-format
          find rom -name '*.c' -o -name '*.h' | xargs -r clang-format --dry-run --Werror

  build-rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM (dockerized rv32 toolchain)
        if: hashFiles('rom/Makefile') != ''
        run: make -C rom
      - name: Verify reproducible-build hash pin
        if: hashFiles('rom/Makefile') != '' && hashFiles('rom/PINNED_HASH') != ''
        run: |
          built=$(sha256sum rom/build/doom-rv32im.bin | cut -d' ' -f1)
          pinned=$(cat rom/PINNED_HASH)
          if [ "$built" != "$pinned" ]; then
            echo "::error::ROM hash mismatch: built=$built pinned=$pinned."
            echo "::error::Either the build went nondeterministic (P0) or you changed the ROM without updating rom/PINNED_HASH in the same PR."
            exit 1
          fi
      - name: Upload ROM artifact
        if: hashFiles('rom/Makefile') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rom
          path: |
            rom/build/doom-rv32im.bin
            rom/build/manifest.json
      - name: Skipped (rom/ not landed yet)
        if: hashFiles('rom/Makefile') == ''
        run: echo "rom workstream not landed — step group skipped by design"

  test-refemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: riscv-tests against reference emulator
        if: hashFiles('refemu/pyproject.toml') != ''
        run: |
          pipx install uv
          cd refemu && uv sync --frozen && uv run pytest -q
      - name: Skipped (refemu/ not landed yet)
        if: hashFiles('refemu/pyproject.toml') == ''
        run: echo "refemu workstream not landed — skipped by design"

  test-sqlcpu:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3   # keep literal in sync with env.CLICKHOUSE_VERSION
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom   # keep in sync with docker-compose.yml
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: riscv-tests inside ClickHouse
        if: hashFiles('sqlcpu/schema.sql') != ''
        run: ./sqlcpu/run_tests.sh --host localhost --port 9000
      - name: Skipped (sqlcpu/ not landed yet)
        if: hashFiles('sqlcpu/schema.sql') == ''
        run: echo "sqlcpu workstream not landed — skipped by design"

  # #116: since #88, three benches AND the whole 16-case test_fold.py suite
  # were broken (missing input_queue in their schema fixtures) with no CI
  # job to catch it -- a green PR page said nothing about any of it for
  # every executor PR in that window. Same shape as #83: a check that
  # silently does nothing looks identical to one that passes.
  test-executor:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3   # keep in sync
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom   # keep in sync with docker-compose.yml
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # executor/tests/*.py's ch() talks to `clickhouse-client` directly
      # over the network (CLICKHOUSE_HOST switches it out of the
      # docker-exec-a-container-named-clickdoom-ch path local dev uses,
      # which has no equivalent here -- GitHub Actions' `services:`
      # containers are reached at localhost:<port>, not by a fixed
      # container name). ubuntu-latest ships neither `clickhouse-client`
      # nor `clickhouse` (same gap sqlcpu/run_tests.sh already works
      # around) -- fetch the official single-file binary and expose it
      # under the name the tests (and every other script in this repo)
      # actually invoke, via a one-line wrapper rather than a rename, since
      # the binary's `client` subcommand is what the fetched form supports.
      - name: Install clickhouse-client
        if: hashFiles('executor/pyproject.toml') != ''
        run: |
          curl -fsSL https://clickhouse.com/ -o /tmp/install.sh
          sh /tmp/install.sh
          sudo install -m 0755 clickhouse /usr/local/bin/clickhouse
          printf '#!/bin/sh\nexec /usr/local/bin/clickhouse client "$@"\n' | sudo tee /usr/local/bin/clickhouse-client >/dev/null
          sudo chmod +x /usr/local/bin/clickhouse-client
      - name: Fold unit tests (executor)
        if: hashFiles('executor/pyproject.toml') != ''
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "9000"
        run: |
          pipx install uv
          cd executor && uv sync --frozen && uv run pytest tests/ -v
      - name: Skipped (executor/ not landed yet)
        if: hashFiles('executor/pyproject.toml') == ''
        run: echo "executor workstream not landed — skipped by design"

  differential-smoke:
    # Highest-value check in the repo: N instructions of the DOOM ROM on
    # refemu vs sqlcpu, the FULL SPEC §7 trace compared (every
    # CHECKPOINT_INTERVAL, not just RAM_HASH_INTERVAL -- #227/#230), not a
    # sampled subset.
    #
    # N=100,000, NOT the 1,000,000 this job used to (unreachably) claim:
    # #227/#230's diff_run.sh clamps every sqlcpu batch to
    # <= CHECKPOINT_INTERVAL (4,096) so it cannot skip a checkpoint row --
    # correct by construction, but ~half run_milestone.sh's
    # instructions/sec at the same K (#180's fitted per-batch model:
    # S=1,754ms fixed setup, a=0.3696ms/step -- setup goes from ~7% of a
    # K=60,000 production batch to ~54% of a K=4,096 one). 1,000,000
    # projects to ~13 minutes at that rate, well past this job's old
    # "~5 minutes" budget; 100,000 projects to ~1.3 minutes. Both are
    # PROJECTED from #180's model, not yet measured against this exact
    # tool (bench-machine timing lock, see #227) -- raise this once a real
    # wall-clock number is in hand. `timeout-minutes` below is a safety net
    # in case that projection is wrong, not a substitute for measuring.
    needs: [build-rom, test-refemu, test-sqlcpu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3   # keep in sync
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom   # keep in sync with docker-compose.yml
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Download ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: rom
          path: rom/build
      - name: Install uv (for refemu's side of the comparison)
        run: pipx install uv
      - name: Run smoke diff (100,000 instructions, full SPEC §7 trace)
        run: ./scripts/diff_run.sh 100000 --host localhost --port 9000
