# Throwaway measurement workflow: the native crate's generated SQL under
# opt-level 2 and 0 on a Linux runner. Not for merging.

name: ci

on:
  pull_request:

permissions: {}

jobs:
  hash:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: hash
      - name: Hash at opt-level 2 and 0
        run: |
          for level in 2 0; do
            cargo test --locked -v --no-run -p clickdoom-native \
                --config "profile.test.package.clickdoom-native.opt-level=$level" \
                --test zz_statement_hash 2>&1 \
              | grep -oE -- '--crate-name zz_statement_hash[^`]*' | grep -oE 'opt-level=[0-9]' || echo "no opt-level flag (0)"
            cargo test --locked -q -p clickdoom-native \
                --config "profile.test.package.clickdoom-native.opt-level=$level" \
                --test zz_statement_hash -- --nocapture 2>&1 \
              | grep -E '^\.?(stage|run |demo|load|parity)' | sed 's/^\.//' > "hash-$level.txt"
            echo "opt-level $level: $(sha256sum < "hash-$level.txt")"
            cut -c1-60 "hash-$level.txt"
          done
          diff hash-2.txt hash-0.txt && echo "identical at opt-level 2 and 0"
