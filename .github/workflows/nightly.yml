# The long differential run, nightly. It does not block merges.
#
# This is the only job that compares memory. ci.yml's differential-smoke stops
# well short of the first RAM_HASH_INTERVAL boundary, so `ramhash` and `fbhash`
# are exercised here and nowhere else. A failure here needs a divergence-report
# issue opened by hand; nothing files one automatically.
#
# Throughput is deliberately not benchmarked here. A shared runner cannot give
# a timing a quiet machine gives, and a gate that fails for reasons unrelated to
# the change is worse than no gate. Run `bench-canonical-throughput` on a quiet
# box instead.

name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      deep_diff_instructions:
        description: "Instruction count for the deep differential run"
        # 5,000,000 is measured, not projected. Three differential runs at
        # N = 8,192 / 100,000 / 1,048,576 gave 910 / 990 / 961 instructions/sec.
        # Sized against the slowest of the three, 5,000,000 takes about
        # 91.6 minutes, a 3.28x margin inside the 300-minute timeout, and
        # crosses 4 RAM_HASH_INTERVAL boundaries.
        default: "5000000"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CLICKHOUSE_USER: default
  # Local-only. This database holds an emulator's RAM and nothing secret.
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_DATABASE: clickdoom

jobs:
  deep-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the pinned ClickHouse
        run: make up
      - name: Build ROM
        run: make -C rom
      - name: Build the reference emulator
        run: cargo build --locked --release -p refemu
      - name: Build clickdoom
        run: cargo build --locked --release -p clickdoom-driver
      - name: Deep differential run (full checkpoint trace)
        # The input goes through env rather than into the run block, so it
        # cannot be read as shell.
        env:
          INSTRUCTIONS: ${{ github.event.inputs.deep_diff_instructions || '5000000' }}
        run: |
          ./target/release/clickdoom diff "$INSTRUCTIONS" --host localhost --port 8123 \
              --bin rom/build/doom-rv32im.bin --manifest rom/build/manifest.json \
              --refemu-bin target/release/refemu
