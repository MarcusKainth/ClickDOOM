# Nightly, non-PR-blocking: the long differential run and the throughput
# benchmark. Failures here open issues (deep-diff failures use the
# divergence-report form) rather than blocking merges.

name: nightly

env:
  # Credentials for the service containers below. Local-dev only: this database
  # holds an emulator's RAM, never a secret. docker-compose.yml must match.
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_DATABASE: clickdoom

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      deep_diff_instructions:
        description: "Instruction count for the deep differential run"
        # #227/#230: diff_run.sh clamps every sqlcpu batch to
        # <= CHECKPOINT_INTERVAL (4,096) so it can compare the FULL SPEC §7
        # trace, not a RAM_HASH_INTERVAL-only sample. #180's fitted
        # per-batch model (S=1,754ms setup + a=0.3696ms/step) projects that
        # to roughly HALF run_milestone.sh's instructions/sec at the same
        # K -- the OLD default here, 200,000,000, projects to ~44 hours
        # (roughly two days), nowhere near this job's 300-minute timeout.
        # 5,000,000 projects to ~66 minutes (ample margin even if real
        # throughput lands well under the projection) and crosses 4
        # RAM_HASH_INTERVAL boundaries, so this job actually exercises the
        # ramhash/fbhash cadence -- ci.yml's differential-smoke, at 100,000
        # instructions, never reaches even one. Both numbers are PROJECTED
        # from #180's model, not yet measured against this exact tool
        # (bench-machine timing lock, see #227) -- raise once real
        # wall-clock data is in hand.
        default: "5000000"

jobs:
  deep-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3   # keep in sync with ci.yml
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom   # keep in sync with docker-compose.yml
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (for refemu's side of the comparison)
        run: pipx install uv
      - name: Deep differential run (full SPEC §7 trace, #227/#230)
        run: |
          make -C rom
          ./scripts/diff_run.sh "${{ github.event.inputs.deep_diff_instructions || '5000000' }}" --host localhost --port 9000

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3   # keep in sync with ci.yml
        env:
          CLICKHOUSE_DB: clickdoom
          CLICKHOUSE_PASSWORD: clickdoom   # keep in sync with docker-compose.yml
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Executor throughput benchmark
        if: hashFiles('executor/bench.sh') != ''
        # bench.sh prints instructions/sec, appends a row to the bench history
        # table (dogfooding: history lives in ClickHouse), and exits non-zero
        # on a >10% regression vs the trailing-7-run median.
        run: ./executor/bench.sh --host localhost --port 9000 --gate 0.10
      - name: Skipped (executor/ not landed yet)
        if: hashFiles('executor/bench.sh') == ''
        run: echo "bench activates when executor lands bench.sh"
