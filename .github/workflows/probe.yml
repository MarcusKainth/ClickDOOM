# Temporary: measures the tic statement's analysis cost on a runner.

name: probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: clickdoom
  CLICKHOUSE_HOST: localhost
  CLICKHOUSE_HTTP_PORT: "8123"

jobs:
  probe:
    if: github.head_ref == 'ci/probe-analysis-cost' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start the pinned ClickHouse
        run: make up
      - name: Build the driver and the batch probe test
        run: |
          cargo build --locked --release -p clickdoom-driver
          cargo test --locked --release -p clickdoom-native --features clickhouse-tests \
              --test probe_batch_live --no-run 2>&1 | tee build-test.log
          sed -n 's/.*Executable .*(\(.*\))$/\1/p' build-test.log | tail -n 1 > batch-bin.txt
          cat batch-bin.txt
      - name: Probe
        run: |
          BATCH_BIN=$(cat batch-bin.txt) scripts/probe-analysis-cost.sh
