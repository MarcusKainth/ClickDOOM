[workspace]
resolver = "3"
members = ["spec", "refemu", "driver", "executor", "native"]
# Pins its own nightly for libFuzzer, so it is not a member.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/MarcusKainth/ClickDOOM"

[workspace.dependencies]
clickdoom-spec = { path = "spec" }
clickdoom-executor = { path = "executor" }
clickdoom-native = { path = "native" }
refemu = { path = "refemu" }
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", features = ["clickhouse"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clickhouse = "0.15"
http = "1.5"
http-body-util = "0.1.5"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "sync",
    "time",
] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The fixture and trace suites run millions of instructions. Optimise them,
# and keep debug assertions on: they are what catches an arithmetic mistake
# the tests would otherwise report as a wrong hash.
[profile.test]
opt-level = 2
