# Local dev ClickHouse — the SAME pinned version as CI (see .github/workflows/*.yml).
# Bumping the pin: `ci:` PR + nightly deep-diff evidence (SPEC §8).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7.5.10@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
    container_name: clickdoom-ch
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    ulimits:
      nofile: 262144
    environment:
      CLICKHOUSE_DB: clickdoom
      # The image ships users.d/default-user.xml restricting `default` to
      # 127.0.0.1/::1 *inside the container*, so every host-side and CI
      # connection is refused with REQUIRED_PASSWORD. Setting a password makes
      # `default` reachable over the network. Keep in sync with the workflows.
      CLICKHOUSE_PASSWORD: clickdoom
    volumes:
      - ch-data:/var/lib/clickhouse
volumes:
  ch-data:
