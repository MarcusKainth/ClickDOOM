[package]
name = "clickdoom-driver"
description = "A persistent ClickHouse client and command-line tool for the ClickDOOM driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
clickdoom-executor.workspace = true
clickdoom-native.workspace = true
clickdoom-spec.workspace = true
clickhouse.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
refemu.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
serde.workspace = true
serde_json.workspace = true
softbuffer = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
winit = { workspace = true, optional = true }

[features]
default = ["window"]
# The window a paced run blits into. Behind a feature so that a headless
# build has --no-window and --frame-dir on a machine with no window system
# at all. winit and softbuffer load X11 and Wayland at run time, so building
# with it needs no development packages either.
window = ["dep:softbuffer", "dep:winit"]

# The tests that execute generated SQL against a real ClickHouse server.
# Behind a feature rather than behind `#[ignore]`, so a run either includes
# them or visibly does not, and an unreachable server is a failure rather
# than an "ignored" line nobody reads.
clickhouse-tests = []

[[bin]]
name = "clickdoom"
path = "src/bin/clickdoom.rs"
