[package]
name = "clickdoom-driver"
description = "A persistent ClickHouse client and command-line tool for the ClickDOOM driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
clickdoom-executor.workspace = true
clickdoom-native.workspace = true
clickdoom-spec.workspace = true
clickhouse.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
minifb = { workspace = true, optional = true }
refemu.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
default = ["window"]
# The window a paced run blits into. Behind a feature because minifb needs
# X11 or Wayland development packages on Linux, and a headless build has
# --no-window and --frame-dir without them.
window = ["dep:minifb"]

# The tests that execute generated SQL against a real ClickHouse server.
# Behind a feature rather than behind `#[ignore]`, so a run either includes
# them or visibly does not, and an unreachable server is a failure rather
# than an "ignored" line nobody reads.
clickhouse-tests = []

[[bin]]
name = "clickdoom"
path = "src/bin/clickdoom.rs"
