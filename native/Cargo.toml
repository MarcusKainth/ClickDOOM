[package]
name = "clickdoom-native"
description = "Native mode: DOOM's tic simulation and renderer as ClickHouse SQL text, and the WAD loader that feeds them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

[dependencies]
bytes.workspace = true
clickdoom-spec.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
clickhouse.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[features]
# The tests that execute generated SQL against a real ClickHouse server.
# Behind a feature rather than behind `#[ignore]`, so a run either includes
# them or visibly does not, and an unreachable server is a failure rather
# than an "ignored" line nobody reads.
clickhouse-tests = []
