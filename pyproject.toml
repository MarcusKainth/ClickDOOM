# Repository-wide Python tooling, and nothing else.
#
# The lint that checks every Python file in the tree needs a pinned version,
# so that a local `make lint` and CI speak the same ruff. It used to live in
# the reference emulator's own project, which stopped being a Python project.
#
# The rules are in ruff.toml. This file pins the tool that reads them.
[project]
name = "clickdoom-tools"
version = "0.0.0"
description = "Pinned Python tooling for the ClickDOOM repository"
license = "Apache-2.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
