[package]
name = "refemu"
description = "The ClickDOOM reference RV32IM interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
clickdoom-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The comparisons that need the pinned ROM built. Behind a feature rather
# than behind a runtime skip, so a run either includes them or visibly does
# not, and a missing ROM is a failure rather than an "ignored" line nobody
# reads.
rom-tests = []
# Compares this interpreter against the Python one, which has to be present.
# Both this feature and the oracle it drives go when the Python does.
py-oracle = []
# Breaks one semantic on purpose, so the differential can be shown catching
# something. A fuzzer that has never failed is indistinguishable from one that
# compares nothing.
fuzz-selftest = []

[[bin]]
name = "refemu"
path = "src/bin/refemu.rs"
