[project]
name = "refemu"
version = "0.1.0"
description = "ClickDOOM reference RV32IM interpreter (the oracle)"
requires-python = ">=3.11"
dependencies = [
    "xxhash>=4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refemu"]
